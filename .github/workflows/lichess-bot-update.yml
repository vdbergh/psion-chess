name: lichess-bot update check

# Once a day: if upstream lichess-bot has a newer version than the one in
# deploy/lichess-bot.txt (what the Lichess bot runs), open an issue with
# the new commits. GitHub then notifies the repository owner by e-mail.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh tools/lichess-bot-update.sh
