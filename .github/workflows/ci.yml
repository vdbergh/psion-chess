# Builds the engine for Linux and Windows, runs the unit tests and uploads
# ready-to-use packages. The UCI integration tests need Psion Chess itself,
# which is not part of the repository: it is downloaded from the Internet
# Archive (see data/README.md), cached, and installed with "psion -d", which
# checks its SHA-256. The artifacts do not include it; only the release
# packages do (see data/LICENCE.md).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PSION_ZIP_URL: https://archive.org/download/psion213/psion213.zip
  PSION_ZIP_SHA256: f2c50e8d46f09c7434e8a26579483586ef92998a4b9ad632b05e367d3741b2d1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # With the tags, for the version (git describe).
        with:
          fetch-depth: 0

      # Statically linked, so that the executable runs on any x86-64 Linux.
      - name: Build
        run: make -j"$(nproc)" LDFLAGS=-static

      - name: Unit tests
        run: make check

      # A tarball keeps the executable bit, which artifact zips lose.
      - name: Package
        run: |
          name=psion-chess-linux-x86_64
          mkdir -p "$name/data" "$name/docs"
          cp psion README.md COPYING AUTHORS "$name/"
          strip "$name/psion"
          cp data/README.md data/LICENCE.md "$name/data/"
          cp docs/*.md "$name/docs/"
          tar czf "$name.tar.gz" "$name"

      # Into a staging directory, as for a package, without Psion's files.
      # Then into a staging directory and a prefix, declining the download:
      # then nothing is installed.
      - name: make install
        run: |
          make install DESTDIR="$PWD/stage" NO_PSION=1 LDFLAGS=-static
          test -x stage/usr/local/bin/psion
          test -f stage/usr/local/share/doc/psion-chess/docs/strength.md
          test -z "$(ls stage/usr/local/share/psion-chess)"
          ! echo n | make install DESTDIR="$PWD/stage2" LDFLAGS=-static
          test ! -e stage2/usr/local/bin
          ! echo n | make install PREFIX="$RUNNER_TEMP/prefix" LDFLAGS=-static
          test ! -e "$RUNNER_TEMP/prefix/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: psion-chess-linux-x86_64
          path: psion-chess-linux-x86_64.tar.gz

  # Cross-compiled with MinGW-w64: a 32-bit executable, which also runs on
  # 64-bit Windows.
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # With the tags, for the version (git describe).
        with:
          fetch-depth: 0

      # A slow mirror can stall apt for good: give up and retry instead.
      - name: Install MinGW-w64
        timeout-minutes: 5
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update && $apt install -y g++-mingw-w64-i686

      - name: Build
        run: |
          make -j"$(nproc)" windows
          make -C tests test_chess.exe TARGET=windows

      - name: Package
        run: |
          name=psion-chess-windows-x86
          mkdir -p "$name/data" "$name/docs"
          cp psion.exe README.md COPYING AUTHORS "$name/"
          i686-w64-mingw32-strip "$name/psion.exe"
          cp data/README.md data/LICENCE.md "$name/data/"
          cp docs/*.md "$name/docs/"
          zip -r "$name.zip" "$name"
          mkdir windows-tests
          cp -r "$name" tests/test_chess.exe windows-tests/

      - uses: actions/upload-artifact@v4
        with:
          name: psion-chess-windows-x86
          path: psion-chess-windows-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: windows-tests

  # macOS on Apple Silicon (arm64), with the interpreter core: built,
  # packaged and tested on the same runner, with Psion's files as for the
  # Linux integration tests.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PACKAGE: psion-chess-macos-arm64
    steps:
      - uses: actions/checkout@v4
        # With the tags, for the version (git describe).
        with:
          fetch-depth: 0

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: make check

      - name: Package
        run: |
          mkdir -p "$PACKAGE/data" "$PACKAGE/docs"
          cp psion README.md COPYING AUTHORS "$PACKAGE/"
          strip "$PACKAGE/psion"
          cp data/README.md data/LICENCE.md "$PACKAGE/data/"
          cp docs/*.md "$PACKAGE/docs/"
          tar czf "$PACKAGE.tar.gz" "$PACKAGE"
          file "$PACKAGE/psion"

      - uses: actions/upload-artifact@v4
        with:
          name: psion-chess-macos-arm64
          path: psion-chess-macos-arm64.tar.gz

      - name: Cache Psion Chess
        id: psion-cache
        uses: actions/cache@v4
        with:
          path: psion213.zip
          key: psion213-${{ env.PSION_ZIP_SHA256 }}
          enableCrossOsArchive: true

      - name: Download Psion Chess
        if: steps.psion-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o psion213.zip "$PSION_ZIP_URL"

      - name: Install Psion Chess
        run: |
          echo y | PSION_ZIP_URL="file://$PWD/psion213.zip" "$PACKAGE/psion" -d
          echo y | "$PACKAGE/psion" -d | grep -q "already installed"

      # How fast the interpreter core is, compared with the recompiler on
      # Linux: the diagnostics show the cycles of a search.
      - name: Speed
        run: |
          (echo uci; echo "debug on"; echo isready
           echo "position startpos moves g2g4"; echo "go movetime 3000"
           sleep 8; echo quit) | "$PACKAGE/psion" 2>&1 |
            grep -E "Searched|bestmove"

      - name: Integration tests
        run: python3 -I tests/uci_test.py "$PWD/$PACKAGE/psion"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uci-test-log-macos
          path: tests/uci_test.log

  # Runs the Linux package with Psion's files: the UCI integration tests,
  # on the oldest and the newest Ubuntu that GitHub offers.
  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PACKAGE: psion-chess-linux-x86_64
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: psion-chess-linux-x86_64

      - name: Unpack the package
        run: tar xzf psion-chess-linux-x86_64.tar.gz

      # Psion Chess, for the integration tests: downloaded once, then cached.
      - name: Cache Psion Chess
        id: psion-cache
        uses: actions/cache@v4
        with:
          path: psion213.zip
          key: psion213-${{ env.PSION_ZIP_SHA256 }}
          enableCrossOsArchive: true

      - name: Download Psion Chess
        if: steps.psion-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o psion213.zip "$PSION_ZIP_URL"

      # From the cached zip: PSION_ZIP_URL overrides the download URL.
      - name: Install Psion Chess
        run: |
          echo y | PSION_ZIP_URL="file://$PWD/psion213.zip" "$PACKAGE/psion" -d
          echo y | "$PACKAGE/psion" -d | grep -q "already installed"
          # Read-only, as for a normal user after "sudo make install".
          chmod a-w "$PACKAGE"/data/*

      - name: Integration tests
        run: $PYTHON -I tests/uci_test.py "$PWD/$PACKAGE/psion"

      # The log has the engine's diagnostics, not Psion's files.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uci-test-log-${{ matrix.os }}
          path: tests/uci_test.log

  # Runs the Windows build on Windows: the unit tests, a start-up check
  # (without Psion's files the engine must report them missing), installing
  # Psion's files with psion -d, the UCI integration tests, and a game
  # start with a French (AZERTY) keyboard layout; on the oldest and the
  # newest Windows that GitHub offers (Windows Server only).
  test-windows:
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: psion-chess-windows-x86
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/download-artifact@v4
        with:
          name: windows-tests

      - name: Unit tests
        run: ./test_chess.exe

      - name: Start-up check
        run: |
          status=0
          echo uci | ./psion-chess-windows-x86/psion.exe 2> stderr.txt || status=$?
          cat stderr.txt
          test "$status" -eq 1
          grep -q "Psion Chess (Chess.exe etc.) not found" stderr.txt

      # Psion Chess, for the integration tests: downloaded once, then cached.
      - name: Cache Psion Chess
        id: psion-cache
        uses: actions/cache@v4
        with:
          path: psion213.zip
          key: psion213-${{ env.PSION_ZIP_SHA256 }}
          enableCrossOsArchive: true

      - name: Download Psion Chess
        if: steps.psion-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o psion213.zip "$PSION_ZIP_URL"

      # From the cached zip, with Windows' own curl: PSION_ZIP_URL overrides
      # the download URL.
      - name: Install Psion Chess
        run: |
          url="file:///$(cygpath -m "$PWD/psion213.zip")"
          echo y | PSION_ZIP_URL="$url" "$PACKAGE/psion.exe" -d
          echo y | "$PACKAGE/psion.exe" -d | grep -q "already installed"

      - name: Integration tests
        run: $PYTHON -I source/tests/uci_test.py "$PACKAGE/psion.exe"

      # DOSBox's keyboardlayout "auto" would load the DOS layout of the host
      # keyboard on Windows, and Psion would get other keys than the ones
      # pressed. Windows PowerShell: on Windows Server 2022, PowerShell 7
      # cannot pass the language list to Set-WinUserLanguageList.
      - name: Switch to a French keyboard layout
        shell: powershell
        run: |
          Set-WinUserLanguageList -LanguageList fr-FR -Force
          Set-ItemProperty -Path 'HKCU:\Keyboard Layout\Preload' -Name 1 -Value '0000040C'

      - name: Play with the French keyboard layout
        run: |
          (echo uci; echo isready; sleep 3; echo "position startpos moves e2e4"
           echo "go movetime 1000"; sleep 15; echo quit) |
            "$PACKAGE/psion.exe" 2>/dev/null | tee azerty.txt
          if grep -q "info string" azerty.txt; then exit 1; fi
          grep -q "bestmove [a-h][1-8][a-h][1-8]" azerty.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uci-test-log-${{ matrix.os }}
          path: source/tests/uci_test.log

  # For version tags (v1.0, ...): publish the packages as a GitHub Release,
  # with Psion's files added (see data/LICENCE.md).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows, integration, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: psion-chess-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: psion-chess-windows-x86

      - name: Cache Psion Chess
        id: psion-cache
        uses: actions/cache@v4
        with:
          path: psion213.zip
          key: psion213-${{ env.PSION_ZIP_SHA256 }}
          enableCrossOsArchive: true

      - name: Download Psion Chess
        if: steps.psion-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o psion213.zip "$PSION_ZIP_URL"

      # With the Linux psion -d, which checks the files, into both packages.
      - name: Add Psion Chess
        run: |
          linux=psion-chess-linux-x86_64
          windows=psion-chess-windows-x86
          tar xzf "$linux.tar.gz"
          unzip -q "$windows.zip"
          export PSION_ZIP_URL="file://$PWD/psion213.zip"
          echo y | "$linux/psion" -d
          echo y | PSION_DIR="$PWD/$windows/data" "$linux/psion" -d
          test "$(ls "$linux/data" | wc -l)" -eq 13
          test "$(ls "$windows/data" | wc -l)" -eq 13
          (echo uci; echo "position startpos moves e2e4"
           echo "go movetime 1000"; sleep 10; echo quit) |
            "$linux/psion" > uci.txt
          grep -q "bestmove [a-h][1-8][a-h][1-8]" uci.txt
          rm "$linux.tar.gz" "$windows.zip"
          tar czf "$linux.tar.gz" "$linux"
          zip -qr "$windows.zip" "$windows"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          linux="psion-chess-$GITHUB_REF_NAME-linux-x86_64.tar.gz"
          windows="psion-chess-$GITHUB_REF_NAME-windows-x86.zip"
          mv psion-chess-linux-x86_64.tar.gz "$linux"
          mv psion-chess-windows-x86.zip "$windows"
          gh release create "$GITHUB_REF_NAME" "$linux" "$windows" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes
