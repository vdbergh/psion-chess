# Builds the engine for Linux and Windows, runs the unit tests and uploads
# ready-to-use packages. The UCI integration tests need Psion Chess itself,
# which is not part of the repository: it is downloaded from Classic DOS
# Games (see data/README.md), checked against its SHA-256 and cached. It is
# only used for the tests, never put into an artifact or a release.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PSION_ZIP_URL: https://www.classicdosgames.com/files/games/psion/psion213.zip
  PSION_ZIP_SHA256: f2c50e8d46f09c7434e8a26579483586ef92998a4b9ad632b05e367d3741b2d1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Statically linked, so that the executable runs on any x86-64 Linux.
      - name: Build
        run: make -j"$(nproc)" LDFLAGS=-static

      - name: Unit tests
        run: make check

      # A tarball keeps the executable bit, which artifact zips lose.
      - name: Package
        run: |
          name=psion-chess-linux-x86_64
          mkdir -p "$name/data"
          cp psion README.md COPYING AUTHORS "$name/"
          strip "$name/psion"
          cp data/README.md "$name/data/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: psion-chess-linux-x86_64
          path: psion-chess-linux-x86_64.tar.gz

  # Cross-compiled with MinGW-w64: a 32-bit executable, which also runs on
  # 64-bit Windows.
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A slow mirror can stall apt for good: give up and retry instead.
      - name: Install MinGW-w64
        timeout-minutes: 5
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update && $apt install -y g++-mingw-w64-i686

      - name: Build
        run: |
          make -j"$(nproc)" windows
          make -C tests test_chess.exe TARGET=windows

      - name: Package
        run: |
          name=psion-chess-windows-x86
          mkdir -p "$name/data"
          cp psion.exe README.md COPYING AUTHORS "$name/"
          i686-w64-mingw32-strip "$name/psion.exe"
          cp data/README.md "$name/data/"
          zip -r "$name.zip" "$name"
          mkdir windows-tests
          cp -r "$name" tests/test_chess.exe windows-tests/

      - uses: actions/upload-artifact@v4
        with:
          name: psion-chess-windows-x86
          path: psion-chess-windows-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: windows-tests

  # Runs the Linux package with Psion's files: the UCI integration tests,
  # on the oldest and the newest Ubuntu that GitHub offers.
  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PACKAGE: psion-chess-linux-x86_64
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: psion-chess-linux-x86_64

      - name: Unpack the package
        run: tar xzf psion-chess-linux-x86_64.tar.gz

      # Psion Chess, for the integration tests: downloaded once, then cached.
      - name: Cache Psion Chess
        id: psion-cache
        uses: actions/cache@v4
        with:
          path: psion213.zip
          key: psion213-${{ env.PSION_ZIP_SHA256 }}
          enableCrossOsArchive: true

      - name: Download Psion Chess
        if: steps.psion-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o psion213.zip "$PSION_ZIP_URL"

      - name: Unpack Psion Chess
        run: |
          $PYTHON -c "import hashlib, sys
          digest = hashlib.sha256(open('psion213.zip', 'rb').read()).hexdigest()
          sys.exit(digest != '$PSION_ZIP_SHA256' and 'psion213.zip: wrong SHA-256 ' + digest)"
          $PYTHON -m zipfile -e psion213.zip "$PACKAGE/data"

      - name: Integration tests
        run: $PYTHON -I tests/uci_test.py "$PWD/$PACKAGE/psion"

      # The log has the engine's diagnostics, not Psion's files.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uci-test-log-${{ matrix.os }}
          path: tests/uci_test.log

  # Runs the Windows build on Windows: the unit tests, a start-up check
  # (without Psion's files the engine must report them missing), then the
  # UCI integration tests with Psion's files; on the oldest and the newest
  # Windows that GitHub offers (Windows Server only).
  test-windows:
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: psion-chess-windows-x86
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/download-artifact@v4
        with:
          name: windows-tests

      - name: Unit tests
        run: ./test_chess.exe

      - name: Start-up check
        run: |
          status=0
          echo uci | ./psion-chess-windows-x86/psion.exe 2> stderr.txt || status=$?
          cat stderr.txt
          test "$status" -eq 1
          grep -q "Psion Chess (Chess.exe etc.) not found" stderr.txt

      # Psion Chess, for the integration tests: downloaded once, then cached.
      - name: Cache Psion Chess
        id: psion-cache
        uses: actions/cache@v4
        with:
          path: psion213.zip
          key: psion213-${{ env.PSION_ZIP_SHA256 }}
          enableCrossOsArchive: true

      - name: Download Psion Chess
        if: steps.psion-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o psion213.zip "$PSION_ZIP_URL"

      - name: Unpack Psion Chess
        run: |
          $PYTHON -c "import hashlib, sys
          digest = hashlib.sha256(open('psion213.zip', 'rb').read()).hexdigest()
          sys.exit(digest != '$PSION_ZIP_SHA256' and 'psion213.zip: wrong SHA-256 ' + digest)"
          $PYTHON -m zipfile -e psion213.zip "$PACKAGE/data"

      - name: Integration tests
        run: $PYTHON -I source/tests/uci_test.py "$PACKAGE/psion.exe"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uci-test-log-${{ matrix.os }}
          path: source/tests/uci_test.log

  # For version tags (v1.0, ...): publish the packages as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows, integration, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: psion-chess-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: psion-chess-windows-x86

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          linux="psion-chess-$GITHUB_REF_NAME-linux-x86_64.tar.gz"
          windows="psion-chess-$GITHUB_REF_NAME-windows-x86.zip"
          mv psion-chess-linux-x86_64.tar.gz "$linux"
          mv psion-chess-windows-x86.zip "$windows"
          gh release create "$GITHUB_REF_NAME" "$linux" "$windows" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes
